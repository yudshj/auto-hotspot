<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Auto Hotspot — Signal / Power</title>
  <desc>Proposal only. A mint wireless signal above a white power switch on a teal rounded tile. All artwork is vector geometry.</desc>
  <defs>
    <linearGradient id="tile" x1="64" y1="16" x2="444" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11AD9D"/>
      <stop offset="0.52" stop-color="#00897E"/>
      <stop offset="1" stop-color="#005C58"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(144 64) rotate(56) scale(440 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BFFE0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9BFFE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#light)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 180 C207 121 305 121 364 180" stroke="#B4FFE5" stroke-width="28"/>
    <path d="M190 220 C226 184 286 184 322 220" stroke="#F4FFFB" stroke-width="28"/>
    <path d="M195 254 A80 80 0 1 0 317 254" stroke="#F4FFFB" stroke-width="30"/>
    <path d="M256 242 V301" stroke="#B4FFE5" stroke-width="30"/>
  </g>
</svg>
